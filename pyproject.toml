[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arborescent"
version = "0.9.0"
description = "One architecture policy that generates import-linter, tach and type-checker configs, then enforces more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Powers" }]
keywords = ["architecture", "import-linter", "tach", "pyright", "clean-architecture", "lint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

# The engines are extras: Arborescent runs them as subprocesses and skips (or, with --require-tools, fails) when absent.
[project.optional-dependencies]
importlinter = ["import-linter>=2.0"]
tach = ["tach>=0.30"]
pyright = ["pyright>=1.1.400"]
ruff = ["ruff>=0.16.3"]
basedpyright = ["basedpyright>=1.30"]
ty = ["ty>=0.0.50"]
pyrefly = ["pyrefly>=0.40"]
# The migration library the driver supplies (`arborescent packages migrate`); not needed by any check.
filterrepo = ["git-filter-repo>=2.38"]
# What `arborescent packages migrate` rewrites imports with, after the library ran.
libcst = ["libcst>=1.0"]
# The opt-in `arborescent.pytest_io_block` plugin (`-p arborescent.pytest_io_block`); no other module needs it.
pytest = ["pytest>=8"]
all = ["import-linter>=2.0", "tach>=0.30", "pyright>=1.1.400", "ruff>=0.16.3", "ty>=0.0.50"]
dev = ["pytest>=8", "jsonschema>=4", "import-linter>=2.0", "tach>=0.30", "pyright>=1.1.400", "ruff>=0.16.3", "basedpyright>=1.30", "ty>=0.0.50", "pyrefly>=0.40", "git-filter-repo>=2.38", "libcst>=1.0", "build"]

[project.urls]
Homepage = "https://github.com/112345brian/arborescent"
Repository = "https://github.com/112345brian/arborescent"
Changelog = "https://github.com/112345brian/arborescent/blob/main/CHANGELOG.md"

[project.scripts]
arborescent = "arborescent.cli:main"

[tool.setuptools]
packages = ["arborescent"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
arborescent = ["py.typed"]

# Arborescent's own architecture, checked by Arborescent (`arborescent check` in this folder).
[tool.arborescent]
python = "3.11"
sources = ["src/arborescent"]
package_catalog = "packages.toml"
source_roots = ["src"]
exclude = ["__pycache__", "tests", "tools"]
forbid_circular_imports = true
# Optional extras that are only imported by modules run as a subprocess (driver_libcst_scan and its driver_libcst_forms): not required dependencies.
tach_external_exclude = ["libcst", "pytest"]
rings = ["domain", "ports", "application", "adapters", "composition"]
type_checkers = ["ty", "pyright"]

[tool.arborescent.groups]
pure = ["__future__", "collections", "dataclasses", "enum", "fnmatch", "re", "typing", "ast", "sys", "tomllib", "io", "tokenize", "posixpath", "json", "bisect"]

[tool.arborescent.ring.domain]
external = ["@pure", "pathlib", "hashlib", "arborescent"]

[tool.arborescent.ring.ports]
may_import = ["domain"]
external = ["@pure", "pathlib", "contextlib", "arborescent"]
require_abstract = true

[tool.arborescent.ring.application]
may_import = ["domain", "ports"]
# pathlib: Path values only (join, relative_to); every disk access goes through FileSystem (tests/test_filesystem.py)
external = ["@pure", "pathlib", "concurrent", "shlex", "arborescent"]
# The application coordinates parallel engines; all other effect categories keep the strict default.
forbid = ["clock", "dynamic-import", "env", "identity", "patch", "process", "randomness", "sleep"]

[tool.arborescent.ring.adapters]
may_import = ["domain", "ports"]
external = ["@pure", "pathlib", "contextlib", "concurrent", "json", "hashlib", "os", "shutil", "subprocess", "tempfile", "time", "sysconfig", "tomllib", "libcst", "arborescent"]
os_branching = true
forbid = ["clock", "dynamic-import", "env", "identity", "patch", "randomness", "sleep", "threads"]

[tool.arborescent.ring.composition]
may_import = ["*"]
external = ["@pure", "argparse", "pathlib", "os", "shlex", "datetime", "random", "time", "types", "pytest", "arborescent"]

[tool.arborescent.classify]
"arborescent" = "domain"
"arborescent.domain" = "domain"
"arborescent.findings" = "domain"
"arborescent.policy_types" = "domain"
