[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "arborescent"
version = "0.3.0"
description = "One architecture policy that generates import-linter, tach and type-checker configs, then enforces more."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Brian Powers" }]
keywords = ["architecture", "import-linter", "tach", "pyright", "clean-architecture", "lint"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
    "Typing :: Typed",
]
dependencies = []

# The engines are extras: Arborescent runs them as subprocesses and skips (or, with --require-tools, fails) when absent.
[project.optional-dependencies]
importlinter = ["import-linter>=2.0"]
tach = ["tach>=0.30"]
pyright = ["pyright>=1.1.400"]
ruff = ["ruff>=0.16.3"]
basedpyright = ["basedpyright>=1.30"]
ty = ["ty>=0.0.50"]
pyrefly = ["pyrefly>=0.40"]
# The migration library the driver supplies (`arborescent packages migrate`); not needed by any check.
filterrepo = ["git-filter-repo>=2.38"]
all = ["import-linter>=2.0", "tach>=0.30", "pyright>=1.1.400", "ruff>=0.16.3", "ty>=0.0.50"]
dev = ["pytest>=8", "jsonschema>=4", "import-linter>=2.0", "tach>=0.30", "pyright>=1.1.400", "ruff>=0.16.3", "basedpyright>=1.30", "ty>=0.0.50", "pyrefly>=0.40", "git-filter-repo>=2.38", "build"]

[project.urls]
Homepage = "https://github.com/112345brian/arborescent"
Repository = "https://github.com/112345brian/arborescent"
Changelog = "https://github.com/112345brian/arborescent/blob/main/CHANGELOG.md"

[project.scripts]
arborescent = "arborescent.cli:main"

[tool.setuptools]
packages = ["arborescent"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
arborescent = ["py.typed"]

# Arborescent's own architecture, checked by Arborescent (`arborescent check` in this folder).
[tool.arborescent]
python = "3.11"
sources = ["src/arborescent"]
source_roots = ["src"]
exclude = ["__pycache__", "tests", "tools"]
forbid_circular_imports = true
rings = ["domain", "ports", "application", "adapters", "composition"]
type_checkers = ["ty", "pyright"]

[tool.arborescent.groups]
pure = ["__future__", "collections", "dataclasses", "enum", "fnmatch", "re", "typing", "ast", "sys", "tomllib", "io", "tokenize", "posixpath", "json"]

[tool.arborescent.ring.domain]
external = ["@pure", "pathlib", "arborescent"]

[tool.arborescent.ring.ports]
may_import = ["domain"]
external = ["@pure", "pathlib", "contextlib", "arborescent"]
require_abstract = true

[tool.arborescent.ring.application]
may_import = ["domain", "ports"]
# pathlib: Path values only (join, relative_to); every disk access goes through FileSystem (tests/test_filesystem.py)
external = ["@pure", "pathlib", "concurrent", "arborescent"]
# The application coordinates parallel engines; all other effect categories keep the strict default.
forbid = ["clock", "dynamic-import", "env", "identity", "patch", "process", "randomness", "sleep"]

[tool.arborescent.ring.adapters]
may_import = ["domain", "ports"]
external = ["@pure", "pathlib", "contextlib", "json", "hashlib", "os", "shutil", "subprocess", "tempfile", "time", "sysconfig", "tomllib", "arborescent"]
os_branching = true
forbid = ["clock", "dynamic-import", "env", "identity", "patch", "randomness", "sleep", "threads"]

[tool.arborescent.ring.composition]
may_import = ["*"]
external = ["@pure", "argparse", "pathlib", "os", "shlex", "arborescent"]

[tool.arborescent.classify]
"arborescent" = "domain"
"arborescent.domain" = "domain"
"arborescent.facts" = "domain"
"arborescent.rules" = "domain"
"arborescent.presets" = "domain"
"arborescent.stdlib" = "domain"
"arborescent.package_model" = "domain"
"arborescent.package_fields" = "domain"
"arborescent.package_parse" = "domain"
"arborescent.package_render" = "domain"
"arborescent.path_exclusion" = "domain"
"arborescent.package_assignment" = "domain"
"arborescent.package_preservation" = "domain"
"arborescent.package_contracts" = "domain"
"arborescent.migration_arguments" = "domain"
"arborescent.migration_json" = "domain"
"arborescent.driver_request" = "domain"
"arborescent.driver_port" = "ports"
"arborescent.ports" = "ports"
"arborescent.annotate" = "application"
"arborescent.generate" = "application"
"arborescent.baseline" = "application"
"arborescent.config" = "application"
"arborescent.engine" = "application"
"arborescent.certification" = "application"
"arborescent.install_tools" = "application"
"arborescent.practices" = "application"
"arborescent.selftest" = "application"
"arborescent.suggestions" = "application"
"arborescent.bench" = "application"
"arborescent.packages" = "application"
"arborescent.package_tree" = "application"
"arborescent.package_manifest" = "application"
"arborescent.package_validation" = "application"
"arborescent.package_copy" = "application"
"arborescent.mutation" = "application"
"arborescent.package_gaps" = "application"
"arborescent.package_probes" = "application"
"arborescent.package_parts" = "application"
"arborescent.package_part_probes" = "application"
"arborescent.migration_export" = "application"
"arborescent.driver_plan" = "application"
"arborescent.module_forbid_probes" = "application"
"arborescent.adapters" = "adapters"
"arborescent.installer_adapter" = "adapters"
"arborescent.clock_adapter" = "adapters"
"arborescent.filesystem_adapter" = "adapters"
"arborescent.scanner" = "adapters"
"arborescent.tool_runner" = "adapters"
"arborescent.typecheckers" = "adapters"
"arborescent.engines" = "adapters"
"arborescent.driver_filter_repo" = "adapters"
"arborescent.testing" = "adapters"
"arborescent.cli" = "composition"
"arborescent.cli_install" = "composition"
"arborescent.cli_report" = "composition"
"arborescent.cli_migrate" = "composition"
"arborescent.__main__" = "composition"

# The annotation layer never depends on the driver (#67): the driver sits on top of it and may import it, not the reverse.
# `selftest` injects one forbidden import per line (module_forbid_probes); tests/test_driver_boundary.py pins the lists.
[tool.arborescent.module_forbid_imports]
"arborescent.package_*" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_filter_repo", "arborescent.cli_migrate"]
"arborescent.path_exclusion" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_filter_repo", "arborescent.cli_migrate"]
"arborescent.migration_arguments" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_filter_repo", "arborescent.cli_migrate"]
"arborescent.migration_json" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_filter_repo", "arborescent.cli_migrate"]
"arborescent.migration_export" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_filter_repo", "arborescent.cli_migrate"]
"arborescent.packages" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_filter_repo", "arborescent.cli_migrate"]

[tool.arborescent.practices]
crlf = ["*.sh", "*.bash"]
undeclared-imports = true
secrets-guard = "tests"
docs-sync = "docs/architecture.md"

[tool.arborescent.ruff]
# The subprocess adapter deliberately owns process execution and passes argument vectors with shell disabled.

[tool.arborescent.ruff.per-file-ignores]
"src/arborescent/tool_runner.py" = ["S404", "S603"]
"src/arborescent/cli_install.py" = ["T20"]
"src/arborescent/cli_report.py" = ["T20"]
"src/arborescent/cli_migrate.py" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = ["external_tools: needs an external tool (git filter-repo, import-linter, tach); skipped with a reason where it is not installed"]

# Contract that lived in the launch-runner root pyproject: the core and the ports stay free of process/file/network modules.
# (`lint-imports` reads this table; the generated arborescent-importlinter.toml is checked by `arborescent check`.)
[tool.importlinter]
root_packages = ["arborescent"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "arborescent core and ports must not import adapters, the engines or process/file/network modules"
type = "forbidden"
source_modules = ["arborescent.domain", "arborescent.facts", "arborescent.presets", "arborescent.stdlib", "arborescent.rules", "arborescent.ports",
    "arborescent.package_model", "arborescent.package_fields", "arborescent.package_parse", "arborescent.package_render",
    "arborescent.path_exclusion", "arborescent.package_assignment", "arborescent.package_preservation", "arborescent.package_contracts",
    "arborescent.migration_arguments", "arborescent.migration_json", "arborescent.driver_request", "arborescent.driver_port"]
forbidden_modules = [
    "arborescent.adapters", "arborescent.tool_runner", "arborescent.typecheckers", "arborescent.engines", "arborescent.engine", "arborescent.cli", "subprocess", "shutil", "tempfile",
    "socket", "urllib",
]
allow_indirect_imports = true

[tool.ruff.lint]
# PIE807 asks for container factories, but Pyright strict reports the field type as
# partially unknown; explicit lambdas keep its inferred type fully concrete.
extend-ignore = ["PIE807"]
