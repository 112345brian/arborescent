# The annotation layer never depends on the driver (#67): the driver sits on top of it and may import it, not the reverse.
# `selftest` injects one forbidden import per line (module_forbid_probes); tests/test_driver_boundary.py pins the lists.
[tool.arborescent.module_forbid_imports]
"arborescent.package_*" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_rewrite", "arborescent.driver_filter_repo", "arborescent.driver_libcst", "arborescent.driver_libcst_scan", "arborescent.driver_libcst_forms", "arborescent.cli_migrate"]
"arborescent.path_exclusion" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_rewrite", "arborescent.driver_filter_repo", "arborescent.driver_libcst", "arborescent.driver_libcst_scan", "arborescent.driver_libcst_forms", "arborescent.cli_migrate"]
"arborescent.migration_arguments" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_rewrite", "arborescent.driver_filter_repo", "arborescent.driver_libcst", "arborescent.driver_libcst_scan", "arborescent.driver_libcst_forms", "arborescent.cli_migrate"]
"arborescent.migration_json" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_rewrite", "arborescent.driver_filter_repo", "arborescent.driver_libcst", "arborescent.driver_libcst_scan", "arborescent.driver_libcst_forms", "arborescent.cli_migrate"]
"arborescent.migration_export" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_rewrite", "arborescent.driver_filter_repo", "arborescent.driver_libcst", "arborescent.driver_libcst_scan", "arborescent.driver_libcst_forms", "arborescent.cli_migrate"]
"arborescent.packages" = ["arborescent.driver_request", "arborescent.driver_port", "arborescent.driver_plan", "arborescent.driver_rewrite", "arborescent.driver_filter_repo", "arborescent.driver_libcst", "arborescent.driver_libcst_scan", "arborescent.driver_libcst_forms", "arborescent.cli_migrate"]

# The tests are excluded from the scan on purpose; parsing the 80+ test files for `mixed-purity-excluded` notes would double the cold scan.
[tool.arborescent.mixed_purity]
report_excluded = false

# Exemptions where a split would not separate anything with a reader of its own (see each reason).
[[tool.arborescent.mixed_purity.allow]]
module = "arborescent.bench"
reason = "A benchmark harness: its 'pure' units (_Timer, _tool, _own_checks) are the step builders bench_one times, closures over the services and policy whose only purpose is to be run under the clock alongside the effectful whole-check step. No other module could use them, so a split would scatter one timing loop over two files."

[[tool.arborescent.mixed_purity.allow]]
module = "arborescent.pytest_io_block"
reason = "An opt-in pytest plugin (loaded only with -p, imported by no module): its 'pure' units are the stand-ins it patches in (_blocked, _BlockedEnviron, _BlockedDatetime, _audit). Each reads the module's own mutable _active flag, and _from_host recognises the plugin by its own __name__ when walking frames, so moving them out would share that state across modules and widen the host check for no reader."

# Import closure of the one program entrypoint, and the importer count from which a module is a hub (#148); `arborescent coupling check` ratchets both.
[tool.arborescent.coupling]
entrypoints = ["arborescent.__main__"]
hub_fan_in = 8

[tool.arborescent.practices]
crlf = ["*.sh", "*.bash"]
undeclared-imports = true
secrets-guard = "tests"
docs-sync = "docs/architecture.md"

[tool.arborescent.ruff]
# The subprocess adapter deliberately owns process execution and passes argument vectors with shell disabled.

[tool.arborescent.ruff.per-file-ignores]
"src/arborescent/tool_runner.py" = ["S404", "S603"]
# Explicitly deferred CLI imports keep help free of runtime adapters and command implementations.
"src/arborescent/cli.py" = ["PLC0415"]
# The opt-in worker launcher runs an explicitly selected binary with fixed argv.
"tools/incremental_analysis.py" = ["S404", "S603"]
"src/arborescent/cli_install.py" = ["T20"]
"src/arborescent/cli_report.py" = ["T20"]
"src/arborescent/cli_migrate.py" = ["T20"]
"src/arborescent/cli_coupling.py" = ["T20"]
"src/arborescent/cli_cycles.py" = ["T20"]
"src/arborescent/cli_purity.py" = ["T20"]
"src/arborescent/cli_admit.py" = ["T20"]

# Only the command line installs and reports the pre-push hook; `selftest` injects an outside import (importable_by_probes).
[tool.arborescent.importable_by]
"arborescent.git_hook" = ["arborescent.cli"]

# The environment variable that points at a local config belongs to the module that reads it; `selftest` spells it elsewhere.
[[tool.arborescent.owned_literal]]
literal = "ARBORESCENT_LOCAL_CONFIG"
modules = ["arborescent.local_targets"]
reason = "the one reader of the local-config environment variable"

# The process pool is chosen where the program is wired; `selftest` calls it from a module outside the composition ring.
[[tool.arborescent.construct_only]]
target = "arborescent.adapters.ProcessPoolParallel"
rings = ["composition"]
reason = "only the composition root picks how work is parallelised"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-q"
markers = ["external_tools: needs an external tool (git filter-repo, import-linter, tach); skipped with a reason where it is not installed"]

[tool.ruff.lint]
# PIE807 asks for container factories, but Pyright strict reports the field type as
# partially unknown; explicit lambdas keep its inferred type fully concrete.
extend-ignore = ["PIE807"]
