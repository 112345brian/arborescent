name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          # The next release (a beta for now): catches breakage early without failing the PR over a pre-release.
          - {os: ubuntu-latest, python: "3.15", experimental: true}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - run: python -m pip install -e ".[dev]" "ruff==0.17.2" "tach==0.35.3"
      - run: python -m pytest
      - name: Architecture (import-linter contract)
        run: lint-imports --config arborescent-importlinter.toml
      - name: Architecture (arborescent dogfood)
        run: python -m arborescent check --require-profile --require-modularity
      - name: Coupling ratchet (hub fan-in and entrypoint closure)
        run: python -m arborescent coupling check
      - name: Mutation self-test
        run: python -m arborescent selftest

  # The opt-in Rust worker's tests are outside `testpaths`, so the matrix above never runs them.
  incremental-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[pytest]"
      - run: cargo build --release --locked --manifest-path tools/incremental_worker/Cargo.toml
      - name: Parity and save tests
        env:
          # Test the binary built above; the fixture fails, never skips, when it is missing.
          ARBORESCENT_WORKER: tools/incremental_worker/target/release/arborescent-incremental-worker
        run: python -m pytest -p no:tach tools/incremental_worker/test_parity.py tools/incremental_worker/test_save.py
